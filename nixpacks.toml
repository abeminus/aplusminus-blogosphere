providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"] # Adjust Node version as needed, e.g., nodejs_22

[phases.install]
cmds = [
    "npm install -g corepack",
    "corepack enable",
    "corepack prepare pnpm@9.1.4 --activate", # Specify your pnpm version
    "pnpm install"
]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "pnpm start"   